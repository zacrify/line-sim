<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE Simulator</title>
<style>
  :root { --line: #06c755; --border: #ddd; --muted: #777; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f5; color: #222; }
  main { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--border); background: #fff; padding: 12px; overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  #spec { display: block; margin-bottom: 12px; color: var(--muted); }
  form { display: flex; flex-wrap: wrap; gap: 6px; }
  input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
  input { flex: 1 1 120px; min-width: 0; }
  button { background: var(--line); border-color: var(--line); color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li button { width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 10px 8px; }
  li button.on { background: #e8f8ee; font-weight: 600; }
  small { color: var(--muted); }
  section { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fff; }
  #log { flex: 1; overflow-y: auto; padding: 16px; background: #8cabd9; }
  .msg { max-width: 70%; margin: 6px 0; }
  .msg p { margin: 2px 0 0; padding: 8px 12px; border-radius: 14px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { margin-left: auto; text-align: right; }
  .msg.bot p { background: #b9f29c; text-align: left; }
  .msg small { color: #f5f5f5; }
  #send { padding: 10px 16px; background: #fff; border-top: 1px solid var(--border); }
  #error { color: #c62828; margin: 6px 0 0; }
  #empty { margin: auto; color: var(--muted); }
  .msg img { display: block; max-width: 240px; max-height: 240px; border-radius: 14px; }
  .msg.bot img { margin-left: auto; }
</style>
</head>
<body>
<main>
  <aside>
    <p id="nochannel" hidden><small>ยังไม่มี channel ตั้ง WEBHOOK_URL + CHANNEL_SECRET ใน .env หรือเรียก POST /sim/channels</small></p>
    <h1>LINE Simulator</h1>
    <a id="spec" href="/openapi.json" target="_blank">API spec (openapi.json)</a>
    <form id="create">
      <input name="name" placeholder="ชื่อผู้ใช้ / ชื่อกลุ่ม" required>
      <select name="kind"><option value="user">แชท 1:1</option><option value="group">กลุ่ม</option></select>
      <select name="channel"></select>
      <button>เพิ่มแชท</button>
    </form>
    <ul id="chats"></ul>
  </aside>
  <section>
    <p id="empty">เพิ่มแชทหรือเลือกแชททางซ้าย</p>
    <header hidden></header>
    <div id="log" hidden></div>
    <form id="send" hidden>
      <input name="sender" placeholder="ชื่อคนส่งในกลุ่ม" style="flex: 0 1 160px">
      <input name="text" placeholder="พิมพ์ข้อความในนามผู้ใช้" autocomplete="off">
      <input name="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,application/pdf" style="flex: 0 1 200px">
      <button>ส่ง</button>
      <p id="error" hidden></p>
    </form>
  </section>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  let chats = [], openId = null, shown = "";

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const time = (iso) => new Date(iso).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });

  const bubble = (m) =>
    !m.media ? `<p>${esc(m.text)}</p>`
    : m.media.image ? `<a href="${esc(m.media.url)}" target="_blank"><img src="${esc(m.media.url)}" alt="${esc(m.text)}"></a>`
    : `<p>📄 <a href="${esc(m.media.url)}" target="_blank">${esc(m.text)}</a></p>`;

  function render() {
    $("#chats").innerHTML = chats.map((c) =>
      `<li><button class="${c.id === openId ? "on" : ""}" data-id="${c.id}">${esc(c.name)}<br><small>${c.kind === "group" ? "กลุ่ม" : "1:1"} · ${c.channel}</small></button></li>`).join("");
    const chat = chats.find((c) => c.id === openId);
    for (const el of ["header", "#log", "#send"]) $(el).hidden = !chat;
    $("#empty").hidden = !!chat;
    if (!chat) return;
    $("header").innerHTML = `<b>${esc(chat.name)}</b> <small>${chat.kind === "group" ? "กลุ่ม" : "1:1"} · ${chat.channel} · ${chat.id}</small>`;
    $("#send [name=sender]").hidden = chat.kind !== "group";
    const html = chat.messages.map((m) =>
      `<div class="msg ${m.from}"><small>${esc(m.name)} · ${time(m.at)}</small>${bubble(m)}</div>`).join("");
    if (html !== shown) {
      $("#log").innerHTML = shown = html;
      $("#log").scrollTop = $("#log").scrollHeight;
    }
  }

  async function load() {
    const [c, ch] = await Promise.all([fetch("/sim/chats"), fetch("/sim/channels")]);
    chats = await c.json();
    const channels = await ch.json();
    const options = channels.map((x) => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
    if ($("#create [name=channel]").innerHTML !== options) $("#create [name=channel]").innerHTML = options;
    $("#nochannel").hidden = channels.length > 0;
    render();
  }

  $("#chats").onclick = (e) => {
    const id = e.target.closest("button")?.dataset.id;
    if (id) { openId = id; shown = ""; render(); }
  };

  $("#create").onsubmit = async (e) => {
    e.preventDefault();
    const chat = await (await fetch("/sim/chats", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) })).json();
    openId = chat.id; shown = "";
    e.target.name.value = "";
    load();
  };

  const base64 = (file) => new Promise((ok) => {
    const reader = new FileReader();
    reader.onload = () => ok(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });

  const post = async (body) => (await fetch(`/sim/chats/${openId}/messages`, { method: "POST", body: JSON.stringify(body) })).json();

  // a file and a caption go as two LINE messages, the way the LINE app sends them
  $("#send").onsubmit = async (e) => {
    e.preventDefault();
    const { sender, text } = Object.fromEntries(new FormData(e.target));
    const file = e.target.file.files[0];
    let result = { error: null };
    if (file) result = await post({ sender, file: { name: file.name, type: file.type, data: await base64(file) } });
    if (!result.error && text) result = await post({ sender, text });
    $("#error").hidden = !result.error;
    $("#error").textContent = result.error ? `แอปตอบ ${result.status}: ${result.error}` : "";
    if (!result.error) { e.target.text.value = ""; e.target.file.value = ""; }
    load();
  };

  load();
  setInterval(load, 1500);
</script>
</body>
</html>
